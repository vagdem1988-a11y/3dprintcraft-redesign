<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Folded-paper field built from the real 3DPrintCraft mark (the same paths
       as logo.svg): a white "lit face" with a blue sliver where the fold
       catches the light. One seamless tile — CSS repeats it. Marks sit well
       inside the tile bounds so the repeat never cuts a shape in half. -->
  <defs>
    <g id="mark">
      <g transform="translate(-346.31197 -357.71996)">
        <!-- Fold shadow. Offset from the face on purpose: stacked exactly on
             top of each other the white face hides it completely, and the blue
             sliver along the fold is the whole point of the look. -->
        <path transform="translate(11 13)" fill="#2e54ff" fill-opacity="0.7" d="M471.80005,425.63486l-.41167-1.1451q46.11641-32.90413,92.23278-65.80828-.24345-.48077-.48685-.96152Q454.67282,391.70084,346.312,425.65021v87.86972l100.8202-24.29579v75.61219L633.2771,539.90326l.06845-.80069-91.6441-23.12741c2.27173-1.45783,3.4508-2.33571,4.73346-3.01932Q573.4637,498.55,600.52423,484.20393c13.74234-7.25218,27.55329-14.37425,41.32443-21.57191q32.546-17.01054,65.07413-34.05519c1.147-.60108,2.21237-1.358,3.31574-2.0423l-.27314-.89967Z"/>
        <!-- lit face -->
        <path fill="#f4f7ff" stroke="#c9d6ff" stroke-width="1.4" d="M471.80005,425.63486H709.96539l.27314.89967c-1.10337.68434-2.16871,1.44122-3.31574,2.0423Q674.395,445.62205,641.84866,462.632c-13.77114,7.19766-27.58209,14.31973-41.32443,21.57191q-27.08753,14.29486-54.08932,28.75191c-1.28266.68361-2.46173,1.56149-4.73346,3.01932l91.6441,23.12741-.06845.80069L447.13217,564.83633V489.22414L346.312,513.51993V425.65021Q454.62249,391.7166,563.13431,357.72q.24339.48077.48685.96152-46.11641,32.90415-92.23278,65.80828Z"/>
      </g>
    </g>
  </defs>

  <rect width="320" height="320" fill="#ffffff"/>

  <!-- two marks per tile, offset and counter-rotated so the field reads as
       scattered paper rather than a grid -->
  <use href="#mark" transform="translate(14 34) rotate(-7) scale(0.5)" opacity="0.95"/>
  <use href="#mark" transform="translate(126 196) rotate(6) scale(0.42)" opacity="0.8"/>
</svg>
